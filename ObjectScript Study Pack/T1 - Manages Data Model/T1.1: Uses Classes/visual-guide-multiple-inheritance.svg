<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#295d91"/></marker></defs><rect width="1440" height="820" fill="#ffffff"/><rect x="24" y="20" width="1392" height="100" rx="21" fill="#143967"/><text x="54" y="83" font-family="Arial, sans-serif" font-size="35" fill="#ffffff" font-weight="700">Multiple inheritance — order and storage in ObjectScript</text><text x="48" y="164" font-family="Arial, sans-serif" font-size="23" fill="#143967" font-weight="700">The same parent list can choose different members using the Inheritance keyword</text><rect x="50" y="196" width="610" height="144" rx="18" fill="#e8f3ff" stroke="#b8d4ee" stroke-width="2"/><text x="74" y="239" font-family="Arial, sans-serif" font-size="25" fill="#205a90" font-weight="700">Tutor.ScreenDefaults</text><text x="74" y="280" font-family="Arial, sans-serif" font-size="22" fill="#122a49" font-weight="500">Channel = "screen"</text><text x="74" y="312" font-family="Arial, sans-serif" font-size="21" fill="#122a49" font-weight="500">Describe() → "Screen output"</text><rect x="782" y="196" width="610" height="144" rx="18" fill="#e8f7ee" stroke="#bbdfca" stroke-width="2"/><text x="806" y="239" font-family="Arial, sans-serif" font-size="25" fill="#247b4a" font-weight="700">Tutor.FileDefaults</text><text x="806" y="280" font-family="Arial, sans-serif" font-size="22" fill="#122a49" font-weight="500">Channel = "file"</text><text x="806" y="312" font-family="Arial, sans-serif" font-size="21" fill="#122a49" font-weight="500">Describe() → "File output"</text><rect x="52" y="395" width="608" height="145" rx="18" fill="#f0eaff" stroke="#c8bde9" stroke-width="2"/><text x="76" y="437" font-family="Arial, sans-serif" font-size="25" fill="#66539e" font-weight="700">Tutor.ReportView</text><text x="76" y="475" font-family="Arial, sans-serif" font-size="20" fill="#122a49" font-weight="500">Extends (ScreenDefaults, FileDefaults)</text><text x="76" y="506" font-family="Arial, sans-serif" font-size="22" fill="#66539e" font-weight="700">[ Inheritance = left ]</text><rect x="782" y="395" width="608" height="145" rx="18" fill="#fff3e6" stroke="#f0d2ad" stroke-width="2"/><text x="806" y="437" font-family="Arial, sans-serif" font-size="25" fill="#946022" font-weight="700">Tutor.FileReportView</text><text x="806" y="475" font-family="Arial, sans-serif" font-size="20" fill="#122a49" font-weight="500">Extends (ScreenDefaults, FileDefaults)</text><text x="806" y="506" font-family="Arial, sans-serif" font-size="22" fill="#946022" font-weight="700">[ Inheritance = right ]</text><path d="M355 340 L355 395" fill="none" stroke="#295d91" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080 340 L1080 395" fill="none" stroke="#295d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="52" y="567" width="608" height="101" rx="18" fill="#eee9ff" stroke="#c8bde9" stroke-width="2"/><text x="77" y="610" font-family="Arial, sans-serif" font-size="19" fill="#493e85" font-weight="700">Channel: "screen"   |   Describe(): "Screen output"</text><text x="77" y="646" font-family="Arial, sans-serif" font-size="18" fill="#122a49" font-weight="500">FileName comes from FileDefaults (no conflict)</text><rect x="782" y="567" width="608" height="101" rx="18" fill="#fff3e6" stroke="#f0d2ad" stroke-width="2"/><text x="807" y="610" font-family="Arial, sans-serif" font-size="19" fill="#875c23" font-weight="700">Channel: "file"   |   Describe(): "File output"</text><text x="807" y="646" font-family="Arial, sans-serif" font-size="18" fill="#122a49" font-weight="500">FileName comes from FileDefaults (no conflict)</text><path d="M355 540 L355 567" fill="none" stroke="#295d91" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080 540 L1080 567" fill="none" stroke="#295d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="52" y="696" width="1338" height="94" rx="18" fill="#e9f4fd" stroke="#b8d4ee" stroke-width="2"/><text x="76" y="733" font-family="Arial, sans-serif" font-size="22" fill="#143967" font-weight="700">Persistent inheritance: Tutor.MIEmployee Extends (Tutor.MIPerson, Tutor.BadgeMixin)</text><text x="76" y="766" font-family="Arial, sans-serif" font-size="20" fill="#122a49" font-weight="500">Primary persistent parent supplies shared data global / ID extent; mixin contributes BadgeCode.</text></svg>