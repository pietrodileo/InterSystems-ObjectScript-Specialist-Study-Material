<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#295d91"/></marker></defs><rect width="1440" height="820" fill="#ffffff"/><rect x="24" y="20" width="1392" height="100" rx="21" fill="#143967"/><text x="54" y="84" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" font-weight="700">Storage definitions — where IRIS stores class data</text><text x="48" y="163" font-family="Arial, sans-serif" font-size="24" fill="#143967" font-weight="700">Tutor.Invoice: one persistent class, different global locations</text><rect x="48" y="192" width="365" height="120" rx="18" fill="#eaf3ff" stroke="#b8d4ee" stroke-width="2"/><text x="72" y="238" font-family="Arial, sans-serif" font-size="25" fill="#1b518a" font-weight="700">DataLocation</text><text x="72" y="275" font-family="Arial, sans-serif" font-size="22" fill="#122a49" font-weight="500">^Tutor.InvoiceD</text><rect x="48" y="329" width="365" height="120" rx="18" fill="#f2ebff" stroke="#d4c3f1" stroke-width="2"/><text x="72" y="375" font-family="Arial, sans-serif" font-size="25" fill="#6948aa" font-weight="700">IdLocation</text><text x="72" y="412" font-family="Arial, sans-serif" font-size="20" fill="#122a49" font-weight="500">^Tutor.InvoiceD (ID counter)</text><rect x="48" y="466" width="365" height="120" rx="18" fill="#e8f7ee" stroke="#b8e0c4" stroke-width="2"/><text x="72" y="511" font-family="Arial, sans-serif" font-size="24" fill="#257a48" font-weight="700">IndexLocation (default)</text><text x="72" y="550" font-family="Arial, sans-serif" font-size="22" fill="#122a49" font-weight="500">^Tutor.InvoiceI</text><rect x="510" y="193" width="882" height="246" rx="18" fill="#f8fbff" stroke="#b8d4ee" stroke-width="2"/><text x="542" y="240" font-family="Arial, sans-serif" font-size="26" fill="#143967" font-weight="700">Two index declarations in the class</text><text x="542" y="287" font-family="Arial, sans-serif" font-size="23" fill="#122a49" font-weight="500">Index DateIdx On InvoiceDate;</text><text x="542" y="331" font-family="Arial, sans-serif" font-size="23" fill="#122a49" font-weight="500">Index CityIdx On City;</text><text x="542" y="391" font-family="Arial, sans-serif" font-size="19" fill="#456c93" font-weight="500">&lt;Index name="CityIdx"&gt;&lt;Location&gt;^Tutor.InvoiceCity&lt;/Location&gt;&lt;/Index&gt;</text><path d="M412 519 L510 510" fill="none" stroke="#295d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="467" width="416" height="121" rx="18" fill="#e8f7ee" stroke="#b8e0c4" stroke-width="2"/><text x="534" y="509" font-family="Arial, sans-serif" font-size="24" fill="#257a48" font-weight="700">DateIdx</text><text x="534" y="550" font-family="Arial, sans-serif" font-size="19" fill="#122a49" font-weight="500">^Tutor.InvoiceI("DateIdx", ...)</text><rect x="950" y="467" width="442" height="121" rx="18" fill="#f8eef9" stroke="#e7cbe8" stroke-width="2"/><text x="974" y="508" font-family="Arial, sans-serif" font-size="23" fill="#80548d" font-weight="700">CityIdx: Location override</text><text x="974" y="550" font-family="Arial, sans-serif" font-size="20" fill="#122a49" font-weight="500">^Tutor.InvoiceCity</text><path d="M1060 440 L1125 467" fill="none" stroke="#295d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="625" width="1344" height="160" rx="18" fill="#fff7e5" stroke="#ead39d" stroke-width="2"/><text x="73" y="666" font-family="Arial, sans-serif" font-size="24" fill="#7e591a" font-weight="700">USEEXTENTSET affects generated global names — not disk extent allocation</text><text x="73" y="711" font-family="Arial, sans-serif" font-size="21" fill="#122a49" font-weight="500">0: ^GlobalsTest.PresidentD  +  ^GlobalsTest.PresidentI("DOBIndex", ...)</text><text x="73" y="751" font-family="Arial, sans-serif" font-size="20" fill="#122a49" font-weight="500">1: ^Ebnm.EKUy.1 (data)  +  