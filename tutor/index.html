
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21328c">
  <title>ObjectScript Certification Tutor</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#lesson">Skip to content</a>
  <header class="topbar">
    <div class="brand"><span translate="no">ObjectScript</span> <span class="brand-detail">Certification tutor</span></div>
    <div class="header-links">
      <button type="button" id="sidebar-toggle" aria-controls="course" aria-expanded="false">Course index</button>
      <a href="https://www.intersystems.com/certifications/intersystems-objectscript-specialist/">Official exam outline ↗</a>
    </div>
  </header>
  <div class="layout">
    <main id="lesson" tabindex="-1">
      <noscript>Enable JavaScript to use the tutor.</noscript>
      <p role="status">Loading the Study Pack… If you opened this file directly, follow the launch instructions in the README.</p>
    </main>
    <aside class="sidebar" id="course" aria-label="Study plan" hidden>
      <header class="drawer-header" id="pinned-header" hidden>
        <h2>Course index</h2>
        <button type="button" id="sidebar-unpin">Unpin</button>
      </header>
      <nav id="course-menu" class="course-menu" aria-label="Course pages"></nav>
      <div class="course-progress">
        <label for="progress">Your progress</label>
        <progress id="progress" max="358" value="0"></progress>
        <p id="progress-label" class="muted"></p>
      </div>
      <div class="progress-transfer">
        <p class="muted">Move your progress between browsers with a backup file.</p>
        <div class="progress-transfer-actions">
          <button type="button" id="export-progress" disabled>Export</button>
          <button type="button" id="import-progress" disabled>Import</button>
          <input id="progress-file" type="file" accept=".json,application/json" hidden>
        </div>
        <p id="progress-transfer-status" class="muted" role="status" aria-live="polite"></p>
      </div>
      <nav id="chapters" aria-label="Chapters"></nav>
    </aside>
  </div>
  <dialog id="course-drawer" class="course-drawer" aria-labelledby="course-drawer-title">
    <header class="drawer-header">
      <h2 id="course-drawer-title">Course index</h2>
      <div class="drawer-actions">
        <button type="button" id="drawer-pin">Pin index</button>
        <button type="button" id="drawer-close" autofocus>Close</button>
      </div>
    </header>
  </dialog>
</body>
</html>
